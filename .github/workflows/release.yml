name: Release Brewui

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Archive App
        run: |
          xcodebuild archive \
            -project Brewui.xcodeproj \
            -scheme Brewui \
            -configuration Release \
            -archivePath Brewui.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Package App (.zip)
        run: |
          # Compress the app bundle using ditto to preserve metadata and code signature
          ditto -c -k --sequesterRsrc --keepParent Brewui.xcarchive/Products/Applications/Brewui.app Brewui-macOS.zip

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package App (.dmg)
        run: |
          # Set up folder to package
          mkdir -p dmg_root
          cp -R Brewui.xcarchive/Products/Applications/Brewui.app dmg_root/
          
          # Build a beautiful DMG using create-dmg
          create-dmg \
            --volname "Brewui" \
            --volicon "Brewui.xcarchive/Products/Applications/Brewui.app/Contents/Resources/AppIcon.icns" \
            --background ".github/assets/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 600 600 \
            --icon-size 100 \
            --icon "Brewui.app" 140 300 \
            --hide-extension "Brewui.app" \
            --app-drop-link 460 300 \
            "Brewui-macOS.dmg" \
            "dmg_root"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} Brewui-macOS.zip Brewui-macOS.dmg --clobber
