name: Release Brewui

# Cuts a new semantically versioned release: computes the next version from the
# latest vX.Y.Z tag, runs the unit tests, builds the app stamped with that
# version, and publishes a GitHub release with the .zip and .dmg attached.
# The tag is only created once everything has built and passed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto reads Conventional Commits since the last tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Test, and Release
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for version calculation

      - name: Calculate Next Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Latest semver tag, accepting both "1.2.3" and "v1.2.3".
          last_version=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)

          if [ -z "$last_version" ]; then
            last_tag=""
            last_version="0.0.0"
            range="HEAD"
          else
            if git rev-parse -q --verify "refs/tags/v${last_version}" >/dev/null; then
              last_tag="v${last_version}"
            else
              last_tag="${last_version}"
            fi
            range="${last_tag}..HEAD"
          fi

          if [ -z "$(git rev-list "$range")" ]; then
            echo "::error::No commits since ${last_tag:-the start of history}; nothing to release."
            exit 1
          fi

          if [ "$BUMP" = "auto" ]; then
            subjects=$(git log --format=%s "$range")
            bodies=$(git log --format=%b "$range")
            if echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$bodies" | grep -q 'BREAKING CHANGE'; then
              BUMP="major"
            elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          IFS=. read -r major minor patch <<< "$last_version"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi

          echo "Last release: ${last_tag:-none}  ->  v${version} (${BUMP} bump)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing v${version}"
            echo "Previous: \`${last_tag:-none}\` · Bump: **${BUMP}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Brewui.xcodeproj \
            -scheme Brewui \
            -destination 'platform=macOS' \
            -only-testing:BrewuiTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Build and Archive App
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project Brewui.xcodeproj \
            -scheme Brewui \
            -configuration Release \
            -archivePath Brewui.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Verify App Version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            Brewui.xcarchive/Products/Applications/Brewui.app/Contents/Info.plist)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::App reports version $actual, expected $VERSION"
            exit 1
          fi

      - name: Package App (.zip)
        run: |
          # Compress the app bundle using ditto to preserve metadata and code signature
          ditto -c -k --sequesterRsrc --keepParent Brewui.xcarchive/Products/Applications/Brewui.app Brewui-macOS.zip

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package App (.dmg)
        run: |
          # Set up folder to package
          mkdir -p dmg_root
          cp -R Brewui.xcarchive/Products/Applications/Brewui.app dmg_root/

          # Build a beautiful DMG using create-dmg
          create-dmg \
            --volname "Brewui" \
            --volicon "Brewui.xcarchive/Products/Applications/Brewui.app/Contents/Resources/AppIcon.icns" \
            --background ".github/assets/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 600 600 \
            --icon-size 100 \
            --icon "Brewui.app" 140 300 \
            --hide-extension "Brewui.app" \
            --app-drop-link 460 300 \
            "Brewui-macOS.dmg" \
            "dmg_root"

      - name: Generate Checksums
        run: shasum -a 256 Brewui-macOS.zip Brewui-macOS.dmg > SHA256SUMS.txt

      - name: Create Tag and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Brewui $TAG" \
            --generate-notes \
            "${flags[@]}" \
            Brewui-macOS.zip Brewui-macOS.dmg SHA256SUMS.txt
